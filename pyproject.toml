[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "haam-rl-twin"
version = "0.4.0"
description = "HAAM-RL for paint-shop color resequencing: digital twin, training, evaluation, HTTP bridge and web inspector"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "gymnasium>=1.0",
  "numpy>=2.0",
  "pydantic>=2.10",
  "stable-baselines3>=2.5",
  "sb3-contrib>=2.5",
  "torch>=2.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.8"]
docs = ["matplotlib>=3.8", "playwright>=1.40"]  # scripts/build_publication.py; then: playwright install chromium

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
